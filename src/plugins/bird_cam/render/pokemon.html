<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

{% for font in font_faces %}
@font-face {
    font-family: "{{ font.font_family }}";
    font-weight: {{ font.font_weight }};
    font-style: {{ font.font_style }};
    src: url({{ font.url }}) format("truetype");
}
{% endfor %}

html, body {
    width: {{ width }}px;
    height: {{ height }}px;
    overflow: hidden;
    background: #b0b0a0;
}

.pokemon-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    background-image: url('{{ bg_image_path }}');
    background-size: cover;
    background-position: top center;
    background-repeat: no-repeat;
}

/* Bird photo zone — upper right, where the wild Pokémon appears */
.bird-zone {
    position: absolute;
    top: 2%;
    right: 3%;
    width: 42%;
    height: 52%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.bird-photo {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* Overlay the dialog box area — white to cover the static placeholder text in the template */
.dialog-box {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 33%;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2% 5%;
}

.dialog-line {
    font-family: 'Dogica', monospace;
    font-size: 2.1em;
    font-weight: normal;
    color: #181818;
    line-height: 1.65;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.dialog-line .bird-name-text {
    font-weight: bold;
}
</style>
</head>
<body>
<div class="pokemon-wrap">

    {% if img_b64 %}
    <div class="bird-zone">
        <img class="bird-photo" src="{{ img_b64 }}" alt="{{ bird_name or 'Bird' }}" />
    </div>
    {% endif %}

    <div class="dialog-box">
        <div class="dialog-line">Wild <span class="bird-name-text">{{ bird_name or '???' }}</span></div>
        <div class="dialog-line">appeared!</div>
    </div>

</div>
</body>
</html>
