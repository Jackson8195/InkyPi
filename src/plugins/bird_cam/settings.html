<div class="form-group">
    <label class="form-label">Camera Host</label>
    <input type="text" id="host" name="host" class="form-input" placeholder="192.168.1.100" />
</div>

<div class="form-group">
    <label class="form-label">Port</label>
    <input type="text" id="port" name="port" class="form-input" placeholder="5000" value="5000" />
</div>

<div class="form-group">
    <label for="theme" class="form-label">Theme</label>
    <select id="theme" name="theme" class="form-input">
        <option value="field_notes">Field Notes — warm parchment</option>
        <option value="night_watch">Night Watch — dark navy</option>
        <option value="minimal">Minimal — clean white</option>
    </select>
</div>

<div class="form-group">
    <label class="form-label">Bird Filter</label>
    <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="radio" name="filterMode" id="filterAll" value="all" checked
                onchange="toggleFilterSection(this.value)">
            Show latest image of any bird
        </label>
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="radio" name="filterMode" id="filterSpecific" value="specific"
                onchange="toggleFilterSection(this.value)">
            Filter to specific species
        </label>
    </div>
</div>

<div id="filter-section" style="display: none;">
    <div class="form-group">
        <button type="button" class="action-button compact" onclick="loadBirdsFromCamera()">
            Load Birds from Camera
        </button>
        <span id="load-status" style="margin-left: 8px; font-size: 0.85em; color: #666;"></span>
    </div>
    <div id="bird-checklist" class="form-group" style="display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        <span style="color: #999; font-size: 0.85em;">Click "Load Birds from Camera" to populate species list.</span>
    </div>
</div>

<div class="form-group">
    <label class="form-label">AI Image Enhancement</label>
    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="ai_enhance" name="ai_enhance" value="true"
            onchange="toggleAiSection(this.checked)">
        Apply AI style to bird images
    </label>
</div>

<div id="ai-section" style="display: none;">
    <div class="form-group">
        <label class="form-label" for="ai_prompt">AI Style Prompt</label>
        <textarea id="ai_prompt" name="ai_prompt" class="form-input"
            rows="4"
            placeholder="e.g. Redraw only the {bird_name} in this image as a detailed colored pencil illustration. Preserve the exact pose, plumage, and proportions faithfully. Apply visible pencil strokes with natural shading. Remove everything else — feeder, background — leaving only the bird on a plain white background."></textarea>
        <small style="color: #888; font-size: 0.8em;">Use <strong>{bird_name}</strong> anywhere in the prompt — it will be replaced with the detected species name at render time. Requires OPEN_AI_SECRET.</small>
    </div>
</div>

<script>
function toggleAiSection(enabled) {
    document.getElementById('ai-section').style.display = enabled ? '' : 'none';
}

function toggleFilterSection(mode) {
    document.getElementById('filter-section').style.display = mode === 'specific' ? '' : 'none';
}

function loadBirdsFromCamera() {
    const host = document.getElementById('host').value.trim();
    const port = document.getElementById('port').value.trim() || '5000';
    if (!host) {
        document.getElementById('load-status').textContent = 'Enter a host IP first.';
        return;
    }

    const statusEl = document.getElementById('load-status');
    statusEl.textContent = 'Loading…';

    const checkedBirds = new Set(
        Array.from(document.querySelectorAll('input[name="bird_filter[]"]:checked')).map(el => el.value)
    );

    fetch(`http://${host}:${port}/api/bird_counts_raw`)
        .then(r => r.json())
        .then(data => {
            const sorted = Object.entries(data).sort((a, b) => b[1] - a[1]);
            const container = document.getElementById('bird-checklist');
            container.innerHTML = '';
            if (sorted.length === 0) {
                container.innerHTML = '<span style="color:#999;font-size:0.85em;">No birds detected yet.</span>';
                statusEl.textContent = '';
                return;
            }
            sorted.forEach(([bird, count]) => {
                const label = document.createElement('label');
                label.style.cssText = 'display:flex;align-items:center;gap:8px;cursor:pointer;';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.name = 'bird_filter[]';
                cb.value = bird;
                cb.checked = checkedBirds.has(bird);
                label.appendChild(cb);
                label.appendChild(document.createTextNode(`${bird} (${count})`));
                container.appendChild(label);
            });
            statusEl.textContent = `${sorted.length} species loaded.`;
        })
        .catch(err => {
            statusEl.textContent = 'Failed to connect. Check host and port.';
            console.error(err);
        });
}

document.addEventListener('DOMContentLoaded', () => {
    if (loadPluginSettings) {
        document.getElementById('host').value = pluginSettings.host || '';
        document.getElementById('port').value = pluginSettings.port || '5000';
        document.getElementById('theme').value = pluginSettings.theme || 'field_notes';

        const aiEnhance = pluginSettings.ai_enhance === 'true';
        document.getElementById('ai_enhance').checked = aiEnhance;
        document.getElementById('ai_prompt').value = pluginSettings.ai_prompt || '';
        toggleAiSection(aiEnhance);

        const filterMode = pluginSettings.filterMode || 'all';
        const radio = document.querySelector(`input[name="filterMode"][value="${filterMode}"]`);
        if (radio) radio.checked = true;
        toggleFilterSection(filterMode);

        if (filterMode === 'specific') {
            const savedFilters = pluginSettings['bird_filter[]'];
            const filters = Array.isArray(savedFilters)
                ? savedFilters
                : (savedFilters ? [savedFilters] : []);

            if (filters.length > 0) {
                const container = document.getElementById('bird-checklist');
                container.innerHTML = '';
                filters.forEach(bird => {
                    const label = document.createElement('label');
                    label.style.cssText = 'display:flex;align-items:center;gap:8px;cursor:pointer;';
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.name = 'bird_filter[]';
                    cb.value = bird;
                    cb.checked = true;
                    label.appendChild(cb);
                    label.appendChild(document.createTextNode(bird));
                    container.appendChild(label);
                });
                const note = document.createElement('span');
                note.style.cssText = 'color:#999;font-size:0.85em;margin-top:4px;';
                note.textContent = 'Click "Load Birds from Camera" to see full species list.';
                container.appendChild(note);
            }
        }
    }
});
</script>
