<div class="form-group">
    <label class="form-label">Camera Host</label>
    <input type="text" id="host" name="host" class="form-input" placeholder="192.168.1.100" />
</div>

<div class="form-group">
    <label class="form-label">Port</label>
    <input type="text" id="port" name="port" class="form-input" placeholder="5000" value="5000" />
</div>

<div class="form-group">
    <label for="theme" class="form-label">Theme</label>
    <select id="theme" name="theme" class="form-input">
        <option value="field_notes">Field Notes</option>
        <option value="night_watch">Night Watch — dark navy</option>
        <option value="minimal">Minimal — clean white</option>
        <option value="pokemon">Pokemon — Wild encounter</option>
    </select>
</div>

<div class="form-group">
    <label class="form-label">Bird Filter</label>
    <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="radio" name="filterMode" id="filterAll" value="all" checked
                onchange="toggleFilterSection(this.value)">
            Show latest image of any bird
        </label>
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="radio" name="filterMode" id="filterSpecific" value="specific"
                onchange="toggleFilterSection(this.value)">
            Filter to specific species
        </label>
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="radio" name="filterMode" id="filterSpecificPhoto" value="specific_photo"
                onchange="toggleFilterSection(this.value)">
            Pin a specific photo
        </label>
    </div>
</div>

<div id="visitor-mode-section" class="form-group">
    <label class="form-label">Display</label>
    <div style="display: flex; flex-direction: column; gap: 8px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="radio" name="visitor_mode" value="highest_score" checked>
            Highest score
        </label>
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="radio" name="visitor_mode" value="most_recent">
            Most recent visitor
        </label>
    </div>
</div>

<div id="filter-section" style="display: none;">
    <div class="form-group">
        <button type="button" class="action-button compact" onclick="loadBirdsFromCamera()">
            Load Birds from Camera
        </button>
        <span id="load-status" style="margin-left: 8px; font-size: 0.85em; color: #666;"></span>
    </div>
    <div id="bird-checklist" class="form-group" style="display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        <span style="color: #999; font-size: 0.85em;">Click "Load Birds from Camera" to populate species list.</span>
    </div>
</div>

<div id="specific-photo-section" style="display: none;">
    <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
        <button type="button" class="action-button compact" onclick="loadSpeciesForPicker()">
            Load Species
        </button>
        <span id="photo-load-status" style="font-size: 0.85em; color: #666;"></span>
    </div>
    <div class="form-group" id="photo-species-wrap" style="display: none;">
        <label class="form-label">Species</label>
        <select id="photo-species-select" class="form-input" onchange="loadThumbnails(this.value)">
            <option value="">— select a species —</option>
        </select>
    </div>
    <div id="photo-thumbnail-grid"
        style="display: none; flex-wrap: wrap; gap: 6px; max-height: 320px; overflow-y: auto; padding: 8px; border: 1px solid #ddd; border-radius: 4px; background: #fafafa;">
    </div>
    <div id="photo-selected-display" style="display: none; margin-top: 6px; font-size: 0.8em; color: #555; word-break: break-all;">
        Pinned: <strong id="photo-selected-name"></strong>
    </div>
    <input type="hidden" name="specific_filename" id="specific_filename_value" value="">
</div>

<div class="form-group">
    <label class="form-label">AI Image Enhancement</label>
    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="ai_enhance" name="ai_enhance" value="true"
            onchange="toggleAiSection(this.checked)">
        Apply AI style to bird images
    </label>
</div>

<div id="ai-section" style="display: none;">
    <div class="form-group">
        <label class="form-label" for="ai_style">Illustration Style</label>
        <select id="ai_style" name="ai_style" class="form-input">
            <option value="colored pencil">Colored Pencil</option>
            <option value="colored ink pen">Colored Ink Pen</option>
            <option value="watercolor">Watercolor</option>
            <option value="vintage pen ink sketch">Vintage Pen Ink Sketch</option>
            <option value="oil painting">Oil Painting</option>
            <option value="acrylic painting">Acrylic Paint</option>
            <option value="graphite sketch">Graphite Sketch</option>
        </select>
    </div>
    <div class="form-group">
        <label class="form-label" for="ai_model">AI Model</label>
        <select id="ai_model" name="ai_model" class="form-input" onchange="toggleAiQuality()">
            <option value="gpt-image-2">GPT Image 2 — OpenAI latest, best results ($0.047/image)</option>
            <option value="flux-kontext-pro">Flux Kontext Pro — faithful image editing ($0.040/image)</option>
            <option value="flux-2-pro">Flux 2 Pro — often 2nd best option ($0.015/run)</option>
        </select>
        <small style="color: #888; font-size: 0.8em;">
            Requires REPLICATE_API_TOKEN in .env.
        </small>
    </div>
    <div class="form-group" id="ai-quality-group" style="display: none;">
        <label class="form-label" for="ai_quality">Image Quality</label>
        <select id="ai_quality" name="ai_quality" class="form-input">
            <option value="high">High — best results, higher cost</option>
            <option value="medium" selected>Medium — balanced</option>
            <option value="low">Low — faster, lower cost</option>
        </select>
    </div>
    <div class="form-group">
        <label class="form-label" for="ai_prompt_suffix">Additional Prompt Text (optional)</label>
        <textarea id="ai_prompt_suffix" name="ai_prompt_suffix" class="form-input" rows="3"
            placeholder="Appended to the end of the AI prompt, e.g. 'Make the style more impressionist.'"></textarea>
    </div>
</div>

<script>
function toggleAiSection(enabled) {
    document.getElementById('ai-section').style.display = enabled ? '' : 'none';
    if (enabled) toggleAiQuality();
}

function toggleAiQuality() {
    const model = document.getElementById('ai_model').value;
    document.getElementById('ai-quality-group').style.display = model === 'gpt-image-2' ? '' : 'none';
}


function toggleFilterSection(mode) {
    document.getElementById('filter-section').style.display = mode === 'specific' ? '' : 'none';
    document.getElementById('specific-photo-section').style.display = mode === 'specific_photo' ? '' : 'none';
    document.getElementById('visitor-mode-section').style.display = mode === 'specific_photo' ? 'none' : '';
}

function loadBirdsFromCamera() {
    const host = document.getElementById('host').value.trim();
    const port = document.getElementById('port').value.trim() || '5000';
    if (!host) {
        document.getElementById('load-status').textContent = 'Enter a host IP first.';
        return;
    }

    const statusEl = document.getElementById('load-status');
    statusEl.textContent = 'Loading…';

    const checkedBirds = new Set(
        Array.from(document.querySelectorAll('input[name="bird_filter[]"]:checked')).map(el => el.value)
    );

    fetch(`http://${host}:${port}/api/bird_counts_raw`)
        .then(r => r.json())
        .then(data => {
            const sorted = Object.entries(data).sort((a, b) => b[1] - a[1]);
            const container = document.getElementById('bird-checklist');
            container.innerHTML = '';
            if (sorted.length === 0) {
                container.innerHTML = '<span style="color:#999;font-size:0.85em;">No birds detected yet.</span>';
                statusEl.textContent = '';
                return;
            }
            sorted.forEach(([bird, count]) => {
                const label = document.createElement('label');
                label.style.cssText = 'display:flex;align-items:center;gap:8px;cursor:pointer;';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.name = 'bird_filter[]';
                cb.value = bird;
                cb.checked = checkedBirds.has(bird);
                label.appendChild(cb);
                label.appendChild(document.createTextNode(`${bird} (${count})`));
                container.appendChild(label);
            });
            statusEl.textContent = `${sorted.length} species loaded.`;
        })
        .catch(err => {
            statusEl.textContent = 'Failed to connect. Check host and port.';
            console.error(err);
        });
}

function loadSpeciesForPicker() {
    const host = document.getElementById('host').value.trim();
    const port = document.getElementById('port').value.trim() || '5000';
    if (!host) {
        document.getElementById('photo-load-status').textContent = 'Enter a host IP first.';
        return;
    }
    const statusEl = document.getElementById('photo-load-status');
    statusEl.textContent = 'Loading…';

    fetch(`http://${host}:${port}/api/bird_counts_raw`)
        .then(r => r.json())
        .then(data => {
            const sorted = Object.entries(data).sort((a, b) => b[1] - a[1]);
            const select = document.getElementById('photo-species-select');
            select.innerHTML = '<option value="">— select a species —</option>';
            sorted.forEach(([bird, count]) => {
                const opt = document.createElement('option');
                opt.value = bird;
                opt.textContent = `${bird} (${count})`;
                select.appendChild(opt);
            });
            document.getElementById('photo-species-wrap').style.display = '';
            statusEl.textContent = `${sorted.length} species loaded.`;
        })
        .catch(err => {
            statusEl.textContent = 'Failed to connect. Check host and port.';
            console.error(err);
        });
}

function loadThumbnails(species) {
    const host = document.getElementById('host').value.trim();
    const port = document.getElementById('port').value.trim() || '5000';
    const grid = document.getElementById('photo-thumbnail-grid');
    const currentSelected = document.getElementById('specific_filename_value').value;

    if (!species) {
        grid.style.display = 'none';
        grid.innerHTML = '';
        return;
    }

    grid.style.display = 'flex';
    grid.innerHTML = '<span style="color:#999;font-size:0.85em;padding:4px;">Loading images…</span>';

    fetch(`http://${host}:${port}/api/images?bird=${encodeURIComponent(species)}`)
        .then(r => r.json())
        .then(files => {
            grid.innerHTML = '';
            if (files.length === 0) {
                grid.innerHTML = '<span style="color:#999;font-size:0.85em;padding:4px;">No images found for this species.</span>';
                return;
            }
            // Newest first
            [...files].reverse().forEach(filename => {
                const img = document.createElement('img');
                img.src = `http://${host}:${port}/images/${filename}`;
                img.title = filename;
                img.style.cssText = 'width:90px;height:90px;object-fit:cover;border-radius:4px;cursor:pointer;border:2px solid transparent;flex-shrink:0;';
                if (filename === currentSelected) {
                    img.style.borderColor = '#4a90d9';
                    img.style.boxShadow = '0 0 0 2px #4a90d9';
                }
                img.onclick = () => selectPhoto(filename, img);
                grid.appendChild(img);
            });
        })
        .catch(err => {
            grid.innerHTML = '<span style="color:#999;font-size:0.85em;padding:4px;">Failed to load images.</span>';
            console.error(err);
        });
}

function selectPhoto(filename, imgEl) {
    document.querySelectorAll('#photo-thumbnail-grid img').forEach(i => {
        i.style.borderColor = 'transparent';
        i.style.boxShadow = '';
    });
    imgEl.style.borderColor = '#4a90d9';
    imgEl.style.boxShadow = '0 0 0 2px #4a90d9';
    document.getElementById('specific_filename_value').value = filename;
    document.getElementById('photo-selected-name').textContent = filename;
    document.getElementById('photo-selected-display').style.display = '';
}


document.addEventListener('DOMContentLoaded', () => {
    if (loadPluginSettings) {
        document.getElementById('host').value = pluginSettings.host || '';
        document.getElementById('port').value = pluginSettings.port || '5000';
        document.getElementById('theme').value = pluginSettings.theme || 'field_notes';

        const aiEnhance = pluginSettings.ai_enhance === 'true';
        document.getElementById('ai_enhance').checked = aiEnhance;
        const aiStyleEl = document.getElementById('ai_style');
        if (aiStyleEl) aiStyleEl.value = pluginSettings.ai_style || 'colored pencil';
        document.getElementById('ai_model').value = pluginSettings.ai_model || 'flux-2-pro';
        document.getElementById('ai_quality').value = pluginSettings.ai_quality || 'medium';
        const aiSuffixEl = document.getElementById('ai_prompt_suffix');
        if (aiSuffixEl) aiSuffixEl.value = pluginSettings.ai_prompt_suffix || '';
        toggleAiSection(aiEnhance);

        const filterMode = pluginSettings.filterMode || 'all';
        const radio = document.querySelector(`input[name="filterMode"][value="${filterMode}"]`);
        if (radio) radio.checked = true;
        toggleFilterSection(filterMode);

        const visitorMode = pluginSettings.visitor_mode || 'highest_score';
        const visitorRadio = document.querySelector(`input[name="visitor_mode"][value="${visitorMode}"]`);
        if (visitorRadio) visitorRadio.checked = true;

        if (filterMode === 'specific') {
            const savedFilters = pluginSettings['bird_filter[]'];
            const filters = Array.isArray(savedFilters)
                ? savedFilters
                : (savedFilters ? [savedFilters] : []);

            if (filters.length > 0) {
                const container = document.getElementById('bird-checklist');
                container.innerHTML = '';
                filters.forEach(bird => {
                    const label = document.createElement('label');
                    label.style.cssText = 'display:flex;align-items:center;gap:8px;cursor:pointer;';
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.name = 'bird_filter[]';
                    cb.value = bird;
                    cb.checked = true;
                    label.appendChild(cb);
                    label.appendChild(document.createTextNode(bird));
                    container.appendChild(label);
                });
                const note = document.createElement('span');
                note.style.cssText = 'color:#999;font-size:0.85em;margin-top:4px;';
                note.textContent = 'Click "Load Birds from Camera" to see full species list.';
                container.appendChild(note);
            }
        }

        if (filterMode === 'specific_photo') {
            const savedFilename = pluginSettings.specific_filename || '';
            if (savedFilename) {
                document.getElementById('specific_filename_value').value = savedFilename;
                document.getElementById('photo-selected-name').textContent = savedFilename;
                document.getElementById('photo-selected-display').style.display = '';
            }
        }
    }
});
</script>
